<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DocSync Dashboard</title>
<style>
body{font-family:system-ui;margin:2rem;background:#0f172a;color:#e2e8f0}
h1{color:#38bdf8}
.card{background:#1e293b;padding:1rem;border-radius:8px;margin:1rem 0}
pre{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h1>DocSync Dashboard</h1>
<div id="reports"></div>
<div id="coverage"></div>
<script>
async function load(){
  const r=await fetch('/reports');const data=await r.json();
  document.getElementById('reports').innerHTML='<h2>Reports</h2>'+data.reports.map(x=>`<div class="card"><b>${x.repo} #${x.pr}</b><pre>${x.report||''}</pre></div>`).join('');
  const c=await fetch('/coverage');const cd=await c.json();
  document.getElementById('coverage').innerHTML='<h2>Coverage</h2>'+cd.coverage.map(x=>`<div class="card">${x.repo}: ${(x.coverage*100).toFixed(1)}% (${x.covered}/${x.total})</div>`).join('');
}
load();
</script>
</body>
</html>
