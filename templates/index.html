<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecDocAuto - LLD Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 min-h-screen flex flex-col">
    <header
      class="sticky top-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 z-50"
    >
      <div class="max-w-4xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">
            <span class="text-blue-600">Tec</span>Doc<span class="text-blue-600"
              >Auto</span
            >
          </h1>
        </div>
      </div>
    </header>

    <main class="flex-1 w-full">
      <div class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-gray-100 mb-4">
          Generate Low-Level Design (LLD) Document
        </h1>

        <form id="projectForm" class="mb-8">
          <div class="space-y-4">
            <div>
              <label
                for="project_path"
                class="block text-sm font-medium text-gray-700 dark:text-gray-300"
              >
                Project Directory Path
              </label>
              <input
                type="text"
                name="project_path"
                id="project_path"
                required
                placeholder="/path/to/your/project"
                class="mt-1 block w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100"
              />
            </div>
            <button
              type="submit"
              class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
            >
              Scan Project
            </button>
          </div>
        </form>

        <div id="resultSection" class="hidden space-y-6">
          <div
            id="fileSelection"
            class="bg-white dark:bg-gray-800 rounded-lg shadow p-6"
          >
            <h2
              class="text-xl font-semibold mb-4 text-gray-900 dark:text-gray-100"
            >
              Selected Files
            </h2>
            <div
              id="selectedFilesList"
              class="space-y-2 text-gray-700 dark:text-gray-300"
            ></div>
          </div>

          <div
            id="generationStatus"
            class="hidden bg-white dark:bg-gray-800 rounded-lg shadow p-6"
          >
            <h2
              class="text-xl font-semibold mb-4 text-gray-900 dark:text-gray-100"
            >
              Generation Status
            </h2>
            <div
              id="statusMessage"
              class="text-gray-700 dark:text-gray-300"
            ></div>
            <div id="progressSection" class="hidden">
              <h3
                class="text-lg font-semibold mb-2 text-gray-900 dark:text-gray-100"
              >
                Progress
              </h3>
              <div
                id="overallProgressBar"
                class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-2.5 mb-4"
              >
                <div
                  id="overallProgressBarFill"
                  class="bg-blue-600 h-2.5 rounded-full"
                  style="width: 0%"
                ></div>
              </div>
              <div id="subTaskProgressBars" class="space-y-2"></div>
            </div>
            <div id="downloadSection" class="hidden mt-4">
              <a
                id="downloadLink"
                href="#"
                class="inline-block px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
              >
                Download LLD Document
              </a>
            </div>
          </div>

          <div id="markdownViewer" class="hidden">
            <h3
              class="text-lg font-semibold mb-2 text-gray-900 dark:text-gray-100"
            >
              Generated Content
            </h3>
            <div
              id="markdownContent"
              class="border p-4 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 overflow-y-auto max-h-96"
            ></div>
          </div>
        </div>
      </div>
    </main>

    <script>
      $(document).ready(function () {
        $("#projectForm").on("submit", function (e) {
          e.preventDefault();
          const projectPath = $("#project_path").val();

          $.ajax({
            url: "/scan_project",
            type: "POST",
            data: JSON.stringify({
              project_path: projectPath,
            }),
            contentType: "application/json",
            success: function (response) {
              showFileSelectionModal(response.tree, response.prompts);
            },
            error: function (xhr, status, error) {
              alert("Failed to scan project: " + error);
            },
          });
        });

        function buildFileTree(tree, container) {
          if (!tree) return;

          if (tree.type === "directory") {
            const ul = $("<ul>", { class: "pl-4" });

            if (tree.name) {
              const li = $("<li>", { class: "py-1" });
              const details = $("<details>");
              const summary = $("<summary>", {
                text: tree.name,
                class:
                  "cursor-pointer hover:text-blue-600 text-gray-900 dark:text-gray-100",
              });

              details.append(summary);

              if (tree.children && tree.children.length > 0) {
                const childUl = $("<ul>", { class: "pl-4" });
                tree.children.forEach((child) => {
                  const childLi = createTreeItem(child);
                  childUl.append(childLi);
                });
                details.append(childUl);
              }

              li.append(details);
              ul.append(li);
            } else {
              if (tree.children && tree.children.length > 0) {
                tree.children.forEach((child) => {
                  const childLi = createTreeItem(child);
                  ul.append(childLi);
                });
              }
            }

            container.append(ul);
          }
        }

        function createTreeItem(item) {
          const li = $("<li>", { class: "py-1" });

          if (item.type === "directory") {
            const details = $("<details>");
            const summary = $("<summary>", {
              text: item.name,
              class:
                "cursor-pointer hover:text-blue-600 text-gray-900 dark:text-gray-100",
            });

            details.append(summary);

            if (item.children && item.children.length > 0) {
              const ul = $("<ul>", { class: "pl-4" });
              item.children.forEach((child) => {
                const childLi = createTreeItem(child);
                ul.append(childLi);
              });
              details.append(ul);
            }

            li.append(details);
          } else {
            const checkbox = $("<input>", {
              type: "checkbox",
              name: "selected_files",
              value: item.path,
              class: "mr-2",
            });

            const label = $("<label>", {
              text: item.name,
              class:
                "cursor-pointer hover:text-blue-600 text-gray-900 dark:text-gray-100",
            });

            li.append(checkbox).append(label);
          }

          return li;
        }

        function buildPromptsSelection(prompts, container) {
          const promptsDiv = $("<div>", { class: "space-y-4" });
          const title = $("<h3>", {
            text: "Select LLD Sections to Generate",
            class:
              "text-lg font-semibold mb-3 text-gray-900 dark:text-gray-100",
          });

          promptsDiv.append(title);

          const defaultCheckbox = $("<input>", {
            type: "checkbox",
            name: "enabled_prompts",
            value: "generate_lld_document",
            checked: true,
            class: "mr-2",
          });

          const defaultLabel = $("<label>", {
            text: "Generate LLD Document",
            class: "cursor-pointer text-gray-900 dark:text-gray-100",
          });

          promptsDiv.append(
            $("<div>").append(defaultCheckbox).append(defaultLabel)
          );

          Object.entries(prompts).forEach(([name, content]) => {
            if (name === "generate_lld_document") return;

            const formattedName = name
              .replace(/_/g, " ")
              .replace(/\.md$/, "")
              .split(" ")
              .map(
                (word) =>
                  word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
              )
              .join(" ");

            const checkbox = $("<input>", {
              type: "checkbox",
              name: "enabled_prompts",
              value: name,
              checked: false,
              class: "mr-2",
            });

            const label = $("<label>", {
              text: formattedName,
              class: "cursor-pointer text-gray-900 dark:text-gray-100",
            });

            const promptDiv = $("<div>").append(checkbox).append(label);
            promptsDiv.append(promptDiv);
          });

          container.append(promptsDiv);
        }

        function showFileSelectionModal(treeData, prompts) {
          const modal = $("<div>", {
            id: "fileTreeModal",
            class:
              "fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50",
          });

          const modalContent = $("<div>", {
            class:
              "bg-white dark:bg-gray-800 p-6 rounded-lg w-1/3 max-h-[80vh] overflow-y-auto space-y-6",
          });

          const treeSection = $("<div>", { class: "space-y-4" });
          const treeTitle = $("<h3>", {
            text: "Select Files to Include",
            class: "text-lg font-semibold text-gray-900 dark:text-gray-100",
          });
          treeSection.append(treeTitle);
          buildFileTree(treeData, treeSection);
          modalContent.append(treeSection);

          const buttonContainer = $("<div>", {
            class: "flex justify-end gap-4 mt-6",
          });

          const cancelButton = $("<button>", {
            text: "Cancel",
            class:
              "px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600",
          }).click(() => modal.remove());

          const continueButton = $("<button>", {
            text: "Continue",
            class:
              "px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700",
          }).click(() => {
            const selectedFiles = collectSelectedFiles();
            if (selectedFiles.length === 0) {
              alert("Please select at least one file to include in the LLD.");
              return;
            }
            modal.remove();
            showMainPageSections(selectedFiles, prompts);
          });

          buttonContainer.append(cancelButton).append(continueButton);
          modalContent.append(buttonContainer);

          modal.append(modalContent);
          $("body").append(modal);
        }

        function showMainPageSections(selectedFiles, prompts) {
          $("#resultSection").removeClass("hidden");

          const filesList = $("#selectedFilesList");
          filesList.empty();
          selectedFiles.forEach((file) => {
            filesList.append(
              $("<div>", {
                text: file,
                class: "text-gray-700 dark:text-gray-300",
              })
            );
          });

          const promptsContainer = $("<div>", {
            id: "promptsSection",
            class: "bg-white dark:bg-gray-800 rounded-lg shadow p-6 mt-6",
          });
          buildPromptsSelection(prompts, promptsContainer);

          const generateButton = $("<button>", {
            text: "Generate LLD",
            class:
              "mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700",
          }).click(() => {
            generateLLD($("#project_path").val());
          });

          promptsContainer.append(generateButton);
          $("#resultSection").append(promptsContainer);
        }

        function collectSelectedFiles() {
          return $('input[name="selected_files"]:checked')
            .map(function () {
              return $(this).val();
            })
            .get();
        }

        function collectEnabledPrompts() {
          const enabledPrompts = {};
          $('input[name="enabled_prompts"]').each(function () {
            enabledPrompts[$(this).val()] = $(this).is(":checked");
          });
          return enabledPrompts;
        }

        function updateOverallProgress(percentage) {
          $("#overallProgressBarFill").css("width", `${percentage}%`);
        }

        function addSubTaskProgressBar(taskName) {
          const progressBar = $(`
            <div class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-2.5">
              <div class="bg-green-600 h-2.5 rounded-full" style="width: 0%" id="${taskName}ProgressBarFill"></div>
            </div>
          `);
          $("#subTaskProgressBars").append(progressBar);
        }

        function updateSubTaskProgress(taskName, percentage) {
          $(`#${taskName}ProgressBarFill`).css("width", `${percentage}%`);
        }

        function displayMarkdownContent(content) {
          $("#markdownViewer").removeClass("hidden");
          $("#markdownContent").html(marked.parse(content));
        }

        function generateLLD(projectPath) {
          const selectedFiles = collectSelectedFiles();
          const enabledPrompts = collectEnabledPrompts();

          $("#generationStatus").removeClass("hidden");
          $("#statusMessage").text("Generating LLD document...");
          $("#progressSection").removeClass("hidden");

          $.ajax({
            url: "/generate_lld",
            type: "POST",
            data: JSON.stringify({
              project_path: projectPath,
              selected_files: selectedFiles,
              enabled_prompts: enabledPrompts,
            }),
            contentType: "application/json",
            success: function (response) {
              $("#statusMessage").text("LLD document generated successfully!");
              updateOverallProgress(100);
              $("#downloadSection").removeClass("hidden");
              $("#downloadLink").attr("href", `/download/${response.lld_path}`);

              mermaid.initialize({ startOnLoad: true });
              response.mermaid_diagrams.forEach((diagram) => {
                const diagramContainer = $("<div>", {
                  class: "mermaid",
                  text: diagram,
                });
                $("#markdownContent").append(diagramContainer);
                mermaid.init(undefined, diagramContainer);
              });

              displayMarkdownContent(response.markdown_output);
            },
            error: function (xhr, status, error) {
              $("#statusMessage").text(
                "Error generating LLD document: " + error
              );
            },
          });
        }
      });
    </script>
  </body>
</html>
