[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docsync"
version = "0.3.0"
description = "Keep documentation in sync with code changes via a GitHub App."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DocSync Contributors" }]
keywords = ["documentation", "github-app", "ai", "code-review"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "openai>=1.55",
    "GitPython>=3.1.62",
    "python-docx>=1.1",
    "pypandoc>=1.17",
    "tiktoken>=0.8",
    "PyGithub>=2.5",
    "python-gitlab>=5.0",
    "PyJWT>=2.15.0",
    "requests>=2.32.4",
    "markdown>=3.7",
    "jinja2>=3.1.6",
    "pyyaml>=6.0",
    "aiohttp>=3.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
docsync = "docsync.cli:main"

[tool.setuptools.packages.find]
include = ["docsync*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
